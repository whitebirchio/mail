# Gate on every push: secret scan → typecheck → test → build → synth (then
# deploy on main, once MailCi exists: T5). There's one environment (SPEC.md,
# ADR-002), so merging to main ships to the real mailbox; branches only run
# the gate. The repo is public, so its run logs are too: never echo a secret.
#
# Only `push` triggers builds: every PR branch is pushed anyway, and its
# checks show on the PR, so a pull_request trigger would just run them twice.
name: CI

permissions:
  contents: read

on:
  push:
  # Manual re-run of the current branch's pipeline without a new commit.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the secret scan reads all of history
      # The repo is public: a secret in any commit is a leak, so scan every
      # commit with .gitleaks.toml. Pinned and checksum-verified.
      - name: Scan history for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          ./gitleaks git --redact --no-banner .
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The packaged app is a CDK asset, so build it before synth.
      - run: npm run build -w mail-web
      # Infra errors fail every branch, not just deploys (no AWS credentials needed to synth).
      - run: npm run synth
