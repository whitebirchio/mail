# Gate on every push: secret scan → typecheck → test → build → synth; then,
# on main only, deploy MailProduction through GitHub OIDC (no stored AWS
# keys). The mail-github-deploy role trusts only main's OIDC subject. There's one environment (SPEC.md,
# ADR-002), so merging to main ships to the real mailbox; branches only run
# the gate. The repo is public, so its run logs are too: never echo a secret.
#
# Only `push` triggers builds: every PR branch is pushed anyway, and its
# checks show on the PR, so a pull_request trigger would just run them twice.
name: CI

permissions:
  contents: read
  id-token: write # OIDC token for aws-actions/configure-aws-credentials

on:
  push:
  # Manual re-run of the current branch's pipeline without a new commit.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the secret scan reads all of history
      # The repo is public: a secret in any commit is a leak, so scan every
      # commit with .gitleaks.toml. Pinned and checksum-verified.
      - name: Scan history for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          ./gitleaks git --redact --no-banner .
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The packaged app is a CDK asset, so build it before synth.
      - run: npm run build -w mail-web
      # Infra errors fail every branch, not just deploys (no AWS credentials needed to synth).
      - run: npm run synth

  deploy:
    needs: build
    # Dormant until MailCi is deployed and the repo variable is set (docs/SETUP.md §3).
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # Queue rather than cancel: a half-finished deploy is worse than a late one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: npm run build -w mail-web
      - name: Deploy MailProduction (AWS)
        run: npm run deploy -w mail-infra
